apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-deployment
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: flask-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: MONGODB_URI
              value: "mongodb://admin:password123@mongodb-service:27017/flask_db?authSource=admin"
          resources:
            requests:
              cpu: "200m" # 0.2 CPU
              memory: "250M"
            limits:
              cpu: "500m" # 0.5 CPU
              memory: "500M"
